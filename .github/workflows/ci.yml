# CI — PR と main への push で、repo の文書の検査と、柵（hook・検査の手）の検査と、コードの検査（lint・型・テスト）を回す。
# job 名（name:）は main の ruleset「main の必須ステータス」（Settings → Rules）に名指しされる。変えるときは ruleset も直す。
# 直さないと、その名前の check が出ないまま PR が merge できなくなる。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: 文書の検査（リンクの実在・要約の古さ）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: 相対リンクが実在するファイルに解決するか
        run: node scripts/リンクの検査.mjs
      - name: 要約が原本（HEAD）より古くなっていないか
        run: node scripts/要約の検査.mjs --head

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: guard-bash の検査
        run: python3 .claude/hooks/guard-bash.test.py
      - name: scripts/ の検査（秘密の検査など）
        run: node --test "scripts/**/*.test.mjs"

  code:
    name: コードの検査（lint・型・テスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: lint と型検査
        run: npm run check
      - name: テスト
        run: npm test
      # 権限分離（tech-requirements 5-25・5-26・5-29 の (a)）。secret は wrangler.jsonc に出ないので (b) の `wrangler secret list` は人が手元で見る。
      # BINDINGS は wrangler の config-schema.json のバインディングのキー。wrangler が増やしたら足す。行頭 // の行は数えない。
      - name: 権限分離（3 Worker のバインディング）
        run: |
          BINDINGS="d1_databases ai services kv_namespaces r2_buckets queues durable_objects vectorize hyperdrive browser workflows send_email analytics_engine_datasets dispatch_namespaces mtls_certificates images media stream version_metadata secrets_store_secrets ai_search ai_search_namespaces agent_memory pipelines artifacts flagship ratelimits worker_loaders vpc_services vpc_networks unsafe_hello_world unsafe analytics k2 logfwdr assets env previews exports"
          fail=0
          for w in ingest orchestrator summarizer; do
            if ! test -f "workers/$w/wrangler.jsonc"; then echo "::error file=workers/$w/wrangler.jsonc::$w の wrangler.jsonc が無い"; fail=1; fi
          done
          [ "$fail" = 0 ] || exit 1
          has() { grep -Ev '^[[:space:]]*//' "workers/$1/wrangler.jsonc" | grep -Eq "\"$2\"[[:space:]]*:"; }
          # check <worker> <5-x> <持つべきキー> <許すキー>: 許すキー以外の BINDINGS があれば、持つべきキーが無ければ落とす
          check() {
            for key in $BINDINGS; do
              case " $4 " in *" $key "*) continue ;; esac
              if has "$1" "$key"; then echo "::error file=workers/$1/wrangler.jsonc::$1 に $key がある（$2）"; fail=1; fi
            done
            for key in $3; do
              if ! has "$1" "$key"; then echo "::error file=workers/$1/wrangler.jsonc::$1 に $key が無い（$2）"; fail=1; fi
            done
          }
          check summarizer 5-25 "" ""
          check orchestrator 5-26 "" "d1_databases services"
          check ingest 5-29 "d1_databases ai" "d1_databases ai"
          exit $fail
