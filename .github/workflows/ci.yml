# CI — PR と main への push で、repo の文書の検査と、柵（hook・検査の手）の検査と、コードの検査（lint・型・テスト）を回す。
# job 名（name:）は main の ruleset「main の必須ステータス」（Settings → Rules）に名指しされる。変えるときは ruleset も直す。
# 直さないと、その名前の check が出ないまま PR が merge できなくなる。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: 文書の検査（リンクの実在・要約の古さ）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: 相対リンクが実在するファイルに解決するか
        run: node scripts/リンクの検査.mjs
      - name: 要約が原本（HEAD）より古くなっていないか
        run: node scripts/要約の検査.mjs --head

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: guard-bash の検査
        run: python3 .claude/hooks/guard-bash.test.py
      - name: scripts/ の検査（秘密の検査など）
        run: node --test "scripts/**/*.test.mjs"

  code:
    name: コードの検査（lint・型・テスト）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: lint と型検査
        run: npm run check
      - name: テスト
        run: npm test
      # 権限分離（tech-requirements 5-25・5-26・5-29 の (a)）。secret は wrangler.jsonc に出ないので (b) の `wrangler secret list` は人が手元で見る。
      - name: 権限分離（3 Worker のバインディング）
        run: |
          has() { grep -Eq "\"$2\"[[:space:]]*:" "workers/$1/wrangler.jsonc"; }
          fail=0
          for key in d1_databases ai services; do
            if has summarizer "$key"; then echo "::error file=workers/summarizer/wrangler.jsonc::summarizer に $key がある（5-25）"; fail=1; fi
          done
          if has orchestrator ai; then echo "::error file=workers/orchestrator/wrangler.jsonc::orchestrator に ai がある（5-26）"; fail=1; fi
          for key in d1_databases ai; do
            if ! has ingest "$key"; then echo "::error file=workers/ingest/wrangler.jsonc::ingest に $key が無い（5-29）"; fail=1; fi
          done
          if has ingest services; then echo "::error file=workers/ingest/wrangler.jsonc::ingest に services がある（5-29）"; fail=1; fi
          exit $fail

